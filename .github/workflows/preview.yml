name: PR Preview Deployment

on:
  pull_request:
    branches:
      - main

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code (needed to get workflow context)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Download WAR artifact from CI workflow
      - name: Download WAR artifact
        uses: actions/download-artifact@v3
        with:
          name: myapp-war
          path: target/

      # 3. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build & Push PR Docker image
      - name: Build & Push PR Docker image
        run: |
          PR_ID=${{ github.event.pull_request.number }}
          IMAGE=${{ secrets.DOCKER_USERNAME }}/myapp:pr-${PR_ID}
          docker build -t $IMAGE .
          docker push $IMAGE

      # 5. Deploy preview on Staging Server
      - name: Deploy preview on Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          script: |
            PR_ID=${{ github.event.pull_request.number }}
            IMAGE=${{ secrets.DOCKER_USERNAME }}/myapp:pr-${PR_ID}

            echo "Pulling new image..."
            docker pull $IMAGE

            echo "Stopping old container if exists..."
            docker stop myapp-pr-${PR_ID} || true
            docker rm myapp-pr-${PR_ID} || true

            echo "Starting new container..."
            docker run -d -p 8080:8080 --name myapp-pr-${PR_ID} $IMAGE
