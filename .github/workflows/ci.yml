name: WalletApp CI/CD

on:
  pull_request:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Lint code
        run: mvn checkstyle:check || echo "Lint skipped"

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: walletapp-jar
          path: target/*.jar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/walletapp:latest
          docker build -t $IMAGE .
          docker push $IMAGE

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: walletapp-jar
          path: ~/walletapp

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/walletapp

            IMAGE=${{ secrets.DOCKER_USERNAME }}/walletapp

            # Create custom network if not exists
            docker network inspect walletapp-network >/dev/null 2>&1 || \
              docker network create walletapp-network

            # Stop and remove old containers
            for c in walletapp wallet-mongo walletapp-nginx; do
              docker stop $c || true
              docker rm $c || true
            done

            # Start MongoDB
            docker run -d \
              --name wallet-mongo \
              --network walletapp-network \
              -p 27017:27017 \
              -v ~/walletapp/mongo-data:/data/db \
              --restart unless-stopped \
              mongo:6.0

            # Start WalletApp container
            docker run -d \
              --name walletapp \
              --network walletapp-network \
              -p 8080:8080 \
              -e SPRING_DATA_MONGODB_URI=mongodb://wallet-mongo:27017/sunduk-pay \
              --restart unless-stopped \
              $IMAGE

            # Start Nginx container
            docker run -d \
              --name walletapp-nginx \
              --network walletapp-network \
              -p 80:80 \
              -p 443:443 \
              -v ~/walletapp/nginx/walletapp.conf:/etc/nginx/conf.d/default.conf:ro \
              --restart unless-stopped \
              nginx:1.24