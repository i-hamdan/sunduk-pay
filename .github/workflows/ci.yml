name: Deploy Kafka

on:
  pull_request:
    branches:
      - master

jobs:
  deploy-kafka:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Kafka via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p ~/kafka-docker
            cd ~/kafka-docker

            cat << 'EOF' > docker-compose.yml
            version: '3.8'
            services:
              zookeeper:
                image: confluentinc/cp-zookeeper:8.9.3
                container_name: zookeeper
                environment:
                  ZOOKEEPER_CLIENT_PORT: 2181
                  ZOOKEEPER_TICK_TIME: 2000
                ports:
                  - "2181:2181"

              kafka:
                image: confluentinc/cp-kafka:8.9.3
                container_name: kafka
                depends_on:
                  - zookeeper
                environment:
                  KAFKA_BROKER_ID: 1
                  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
                  KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://147.93.28.239:9092
                  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
                ports:
                  - "9092:9092"
                volumes:
                  - kafka-data:/var/lib/kafka/data

            volumes:
              kafka-data:
            EOF

            docker-compose down
            docker-compose up -d
            docker ps
