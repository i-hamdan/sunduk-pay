name: PR-Build-and-Deploy

on:
  pull_request:
    branches:
      - master

jobs:
  # 1️⃣ Lint code
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Run Checkstyle
        run: mvn checkstyle:check

  # 2️⃣ Build JAR
  build-jar:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Verify JAR exists
        run: |
          JAR_FILE=$(ls target/*.jar | head -n1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: JAR not found"
            exit 1
          fi
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: walletApp-jar
          path: ${{ env.JAR_FILE }}

  # 3️⃣ Build & push Docker image
  docker-build:
    runs-on: ubuntu-latest
    needs: build-jar
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: walletApp-jar
          path: target/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/walletapp:pr-${{ github.event.number }}
          echo "Building Docker image: $IMAGE"
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

  # 4️⃣ Deploy Docker Compose stack on VPS
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET
          script: |
            cd /home/sunduk

            echo "Stopping existing stack if any..."
            docker-compose down || true

            echo "Pulling latest image..."
            docker pull $IMAGE

            echo "Starting Docker Compose stack..."
            docker-compose up -d --build

            echo "Stack deployed successfully!"
            docker ps
