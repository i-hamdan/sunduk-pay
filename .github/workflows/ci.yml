name: CI Pipeline

on:
    pull_request:
      branches:
        - master

jobs:
    build-and-push:
      runs-on: ubuntu-latest

      steps:
        # Checkout the repository code
        - name: Checkout code
          uses: actions/checkout@v4

        # Set up JDK for building the Java application
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: 'maven'

        # Build the JAR file with Maven
        - name: Build JAR with Maven
          run: mvn clean package -DskipTests

        # Upload the JAR file as an artifact
        - name: Upload JAR artifact
          uses: actions/upload-artifact@v4
          with:
            name: walletapp-jar
            path: target/*.jar
            retention-days: 7

        # Set up Docker Buildx for multi-platform builds
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        # Log in to Docker Hub
        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        # Extract PR number for tagging (or use commit SHA for non-PR pushes)
        - name: Extract PR number
          id: pr-number
          run: |
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "pr_number=PR-${{ github.event.number }}" >> $GITHUB_OUTPUT
            else
              echo "pr_number=latest" >> $GITHUB_OUTPUT
            fi

        # Build and push the app Docker image
        - name: Build and push Docker image
          uses: docker/build-push-action@v6
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME_LOWER }}/walletapp:${{ steps.pr-number.outputs.pr_number }}
            build-args: |
              DOCKER_USERNAME_LOWER=${{ secrets.DOCKER_USERNAME_LOWER }}

        # Run tests using Docker Compose
        - name: Run tests with Docker Compose
          env:
            SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/sunduk-pay
            GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
            DOCKER_USERNAME_LOWER: ${{ secrets.DOCKER_USERNAME_LOWER }}
            PR_NUMBER: ${{ steps.pr-number.outputs.pr_number }}
          run: |
            # Start services
            docker-compose -f docker-compose.yml up -d
            # Run tests (replace with your actual test command)
            docker-compose exec -T app mvn test || exit 1
            docker-compose down

        # Clean up Docker images
        - name: Clean up
          if: always()
          run: |
            docker system prune -f

    deploy:
      runs-on: ubuntu-latest
      needs: build-and-push  # Run after build-and-push job
      steps:
        # Checkout code to access docker-compose.yml
        - name: Checkout code
          uses: actions/checkout@v4

        # Deploy to VPS via SSH
        - name: Deploy to VPS
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SERVER_SSH_KEY }}
            script: |
              cd ~/walletapp
              export DOCKER_USERNAME_LOWER=${{ secrets.DOCKER_USERNAME_LOWER }}
              export PR_NUMBER=latest
              export SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/sunduk-pay
              export GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
              export GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
              docker-compose pull
              docker-compose down
              docker-compose up -d --remove-orphans
