name: Build & Deploy Preview

on:
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Checkstyle
        run: mvn checkstyle:check

  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: lint
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Verify JAR file exists
        run: |
          ls -l target/
          JAR_FILE=$(ls target/*.jar | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: No JAR file found in target/ directory"
            exit 1
          fi
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: walletApp-jar
          path: ${{ env.JAR_FILE }}
          retention-days: 1

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build-jar
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: walletApp-jar
          path: target/

      - name: Verify downloaded JAR file
        run: |
          ls -l target/
          JAR_FILE=$(ls target/*.jar | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: Downloaded JAR file not found in target/ directory"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Preview Docker image
        run: |
          DOCKER_USERNAME_LOWER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=${DOCKER_USERNAME_LOWER}/walletapp:preview
          echo "Building Docker image: $IMAGE"
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Create Docker Compose and Nginx config
        run: |
          DOCKER_USERNAME_LOWER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          mkdir -p nginx
          cat > nginx/nginx.conf << 'EOF'
          events {}
          http {
              upstream springboot {
                  server app:8080;
              }
              server {
                  listen 80;
                  server_name srv1005736.hstgr.cloud;
                  location /api/sunduk-service {
                      proxy_pass http://springboot/api/sunduk-service;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }
                  location /health {
                      proxy_pass http://springboot/health;
                  }
              }
          }
          EOF
          cat > docker-compose.yml << EOF
          version: '3.9'
          services:
            app:
              image: \${DOCKER_USERNAME_LOWER}/walletapp:preview
              environment:
                - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/walletapp-preview
                - GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
                - GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
                - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI=http://srv1005736.hstgr.cloud/api/sunduk-service/login/oauth2/code/google
              networks:
                - app-network
            mongodb:
              image: mongo:6.0
              volumes:
                - mongo-data:/data/db
              environment:
                - MONGO_INITDB_DATABASE=walletapp-preview
              networks:
                - app-network
            nginx:
              image: nginx:latest
              ports:
                - "8080:80"
              volumes:
                - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
              depends_on:
                - app
              networks:
                - app-network
          networks:
            app-network:
              driver: bridge
          volumes:
            mongo-data:
          EOF

      - name: Deploy preview on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME_LOWER: ${{ secrets.DOCKER_USERNAME }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DOCKER_USERNAME_LOWER
          script: |
            if [ -z "${{ secrets.SERVER_USER }}" ]; then
              echo "Error: SERVER_USER is not set"
              exit 1
            fi
            echo "Checking Docker and Docker Compose..."
            if ! command -v docker >/dev/null 2>&1; then
              echo "Error: Docker is not installed"
              exit 1
            fi
            if ! command -v docker-compose >/dev/null 2>&1; then
              echo "Error: Docker Compose is not installed"
              exit 1
            fi
            DOCKER_USERNAME_LOWER=$(echo "$DOCKER_USERNAME_LOWER" | tr '[:upper:]' '[:lower:]')
            IMAGE=$DOCKER_USERNAME_LOWER/walletapp:preview
            PREVIEW_DIR=/home/${{ secrets.SERVER_USER }}/preview
            echo "PREVIEW_DIR is set to: $PREVIEW_DIR"
            mkdir -p $PREVIEW_DIR/nginx
            chown ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} $PREVIEW_DIR
            chmod u+rwx $PREVIEW_DIR
            echo "Copying Docker Compose and Nginx config..."
            cat > $PREVIEW_DIR/docker-compose.yml << EOF
            version: '3.9'
            services:
              app:
                image: \$IMAGE
                environment:
                  - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/walletapp-preview
                  - GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
                  - GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
                  - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI=http://srv1005736.hstgr.cloud/api/sunduk-service/login/oauth2/code/google
                networks:
                  - app-network
              mongodb:
                image: mongo:6.0
                volumes:
                  - mongo-data:/data/db
                environment:
                  - MONGO_INITDB_DATABASE=walletapp-preview
                networks:
                  - app-network
              nginx:
                image: nginx:latest
                ports:
                  - "8080:80"
                volumes:
                  - \$PREVIEW_DIR/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
                depends_on:
                  - app
                networks:
                  - app-network
            networks:
              app-network:
                driver: bridge
            volumes:
              mongo-data:
            EOF
            cat > $PREVIEW_DIR/nginx/nginx.conf << 'EOF'
            events {}
            http {
                upstream springboot {
                    server app:8080;
                }
                server {
                    listen 80;
                    server_name srv1005736.hstgr.cloud;
                    location /api/sunduk-service {
                        proxy_pass http://springboot/api/sunduk-service;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                    }
                    location /health {
                        proxy_pass http://springboot/health;
                    }
                }
            }
            EOF
            echo "Verifying docker-compose.yml exists..."
            if [ ! -f "$PREVIEW_DIR/docker-compose.yml" ]; then
              echo "Error: Failed to create $PREVIEW_DIR/docker-compose.yml"
              ls -la $PREVIEW_DIR
              exit 1
            fi
            echo "Pulling Docker image: $IMAGE"
            docker pull $IMAGE
            echo "Stopping and removing old stack if exists..."
            docker-compose -f $PREVIEW_DIR/docker-compose.yml down || true
            echo "Starting new stack..."
            docker-compose -f $PREVIEW_DIR/docker-compose.yml up -d