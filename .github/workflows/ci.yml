name: PR Preview Deployment

on:
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Checkstyle
        run: mvn checkstyle:check

  build-war:
    name: Build WAR
    runs-on: ubuntu-latest
    needs: lint
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build WAR
        run: mvn clean package -DskipTests

      - name: Verify WAR file exists
        run: |
          ls -l target/
          if [ ! -f target/*.war ]; then
            echo "Error: No WAR file found in target/ directory"
            exit 1
          fi

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp-war
          path: target/*.war
          retention-days: 1

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build-war
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp-war
          path: target/

      - name: Verify downloaded WAR file
        run: |
          ls -l target/
          if [ ! -f target/*.war ]; then
            echo "Error: Downloaded WAR file not found in target/ directory"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push PR Docker image
        run: |
          PR_ID=${{ github.event.pull_request.number }}
          IMAGE=${{ secrets.DOCKER_USERNAME }}/myapp:pr-${PR_ID}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy preview on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          script: |
            PR_ID=${{ github.event.pull_request.number }}
            IMAGE=${{ secrets.DOCKER_USERNAME }}/myapp:pr-${PR_ID}

            echo "Pulling new image..."
            docker pull $IMAGE

            echo "Stopping old container if exists..."
            docker stop myapp-pr-${PR_ID} || true
            docker rm myapp-pr-${PR_ID} || true

            echo "Starting new container..."
            docker run -d -p 8080:8080 --name myapp-pr-${PR_ID} $IMAGE