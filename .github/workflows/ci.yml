name: Build & Deploy Preview

on:
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Checkstyle
        run: mvn checkstyle:check

  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: lint
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Verify JAR file exists
        run: |
          ls -l target/
          JAR_FILE=$(ls target/*.jar | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: No JAR file found in target/ directory"
            exit 1
          fi
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: walletApp-jar
          path: ${{ env.JAR_FILE }}
          retention-days: 1

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build-jar
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: walletApp-jar
          path: target/

      - name: Verify downloaded JAR file
        run: |
          ls -l target/
          JAR_FILE=$(ls target/*.jar | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: Downloaded JAR file not found in target/ directory"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Preview Docker image
        run: |
          DOCKER_USERNAME_LOWER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          if [ -z "$DOCKER_USERNAME_LOWER" ]; then
            echo "Error: DOCKER_USERNAME_LOWER is not set"
            exit 1
          fi
          IMAGE=${DOCKER_USERNAME_LOWER}/walletapp:preview
          echo "Building Docker image: $IMAGE"
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy walletapp on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME_LOWER: ${{ secrets.DOCKER_USERNAME }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DOCKER_USERNAME_LOWER,SERVER_USER
          script: |
            if [ -z "$SERVER_USER" ] || [ -z "$DOCKER_USERNAME_LOWER" ]; then
              echo "Error: Required environment variables not set"
              exit 1
            fi
            echo "Checking Docker..."
            if ! command -v docker >/dev/null 2>&1; then
              echo "Error: Docker is not installed"
              exit 1
            fi
            DOCKER_USERNAME_LOWER=$(echo "$DOCKER_USERNAME_LOWER" | tr '[:upper:]' '[:lower:]')
            IMAGE=$DOCKER_USERNAME_LOWER/walletapp:preview
            CONTAINER_NAME=walletapp-preview
            echo "Pulling Docker image: $IMAGE"
            docker pull $IMAGE
            echo "Stopping old container if exists..."
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            echo "Starting new container..."
            docker run -d --name $CONTAINER_NAME -p 8080:8080 $IMAGE
            if [ $? -ne 0 ]; then
              echo "Error: Failed to start walletapp container"
              docker logs $CONTAINER_NAME
              exit 1
            fi
