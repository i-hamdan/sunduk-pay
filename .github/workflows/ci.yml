name: WalletApp CI-CD

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Lint, Build & Upload JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Lint (optional)
        run: ./mvnw checkstyle:check || echo "Lint step skipped"

      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: walletapp-jar
          path: target/*.jar

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: walletapp-jar
          path: target/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/walletapp:${{ github.sha }}
          docker build -t $IMAGE .
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Push Docker image
        run: docker push $IMAGE

      - name: Upload Image Name as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-name
          path: <(echo $IMAGE)

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Download Image Name
        uses: actions/download-artifact@v4
        with:
          name: image-name
          path: ./image

      - name: Get Image Name
        run: echo "IMAGE=$(cat ./image/*)" >> $GITHUB_ENV

      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Pulling new image..."
            docker pull $IMAGE
            echo "Stopping old containers..."
            docker-compose -f /home/${{ secrets.SERVER_USER }}/walletapp/docker-compose.yml down || true
            echo "Starting new containers..."
            IMAGE=$IMAGE docker-compose -f /home/${{ secrets.SERVER_USER }}/walletapp/docker-compose.yml up -d --build
