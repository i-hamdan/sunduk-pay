name: Build & Deploy Preview

on:
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Run Maven Checkstyle plugin or your own linting command
      - name: Run Checkstyle
        run: mvn checkstyle:check

  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: lint
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Verify JAR file exists
        run: |
          ls -l target/
          if [ ! -f target/walletApp-0.0.1-SNAPSHOT.jar ]; then
            echo "Error: No JAR file found in target/ directory"
            exit 1
          fi

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: walletApp-jar
          path: target/walletApp-0.0.1-SNAPSHOT.jar
          retention-days: 1

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build-jar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: walletApp-jar
          path: target/

      - name: Verify downloaded JAR file
        run: |
          ls -l target/
          if [ ! -f target/walletApp-0.0.1-SNAPSHOT.jar ]; then
            echo "Error: Downloaded JAR file not found in target/ directory"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push PR Docker image
        run: |
          PR_ID=${{ github.event.pull_request.number }}
          IMAGE=${{ secrets.DOCKER_USERNAME }}/walletApp:pr-${PR_ID}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy preview on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            PR_ID=${{ github.event.pull_request.number }}
            IMAGE=${{ secrets.DOCKER_USERNAME }}/walletApp:pr-${PR_ID}
            docker pull $IMAGE
            docker stop walletApp-pr-${PR_ID} || true
            docker rm walletApp-pr-${PR_ID} || true
            docker run -d -p 8080:8080 --name walletApp-pr-${PR_ID} \
              -e GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
              -e GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
              $IMAGE
