name: Deploy MongoDB

on:
  pull_request:
    branches:
      - master

jobs:
  deploy-mongodb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy MongoDB via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            #!/bin/bash

            # Set deploy directory in home to avoid permission issues
            DEPLOY_DIR=~/mongodb-deploy

            # Create folder if it doesn't exist
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR || exit 1

            # If repo exists, reset and clean; otherwise clone
            if [ -d ".git" ]; then
              echo "Repository exists. Resetting and cleaning..."
              git fetch origin
              git reset --hard origin/master   # or origin/master
              git clean -fd
            else
              echo "Cloning repository..."
              git clone https://github.com/i-hamdan/mongodb-deploy.git .
            fi

            # Make sure docker-compose.yml exists
            if [ ! -f "docker-compose.yml" ]; then
              echo "ERROR: docker-compose.yml not found!"
              exit 1
            fi

            # Pull latest Docker images and start MongoDB container
            docker-compose pull
            docker-compose up -d

            echo "MongoDB deployment completed successfully!"
