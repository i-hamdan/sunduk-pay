name: Deploy MongoDB

on:
  pull_request:
    branches:
      - master

jobs:
  deploy-mongodb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy MongoDB via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Use home directory to avoid permission issues
            mkdir -p ~/mongodb-deploy
            cd ~/mongodb-deploy
            
            # Pull latest repo
            if [ ! -d ".git" ]; then
              git clone https://github.com/i-hamdan/***-pay.git .
            else
              git reset --hard
              git clean -fd
              git pull
            fi
            
            # Make sure docker-compose.yml exists
            ls -l
            
            # Start MongoDB container
            docker-compose up -d
