name: Deploy MongoDB

on:
  pull_request:
    branches:
      - master

jobs:
  deploy-mongodb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy MongoDB via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            #!/bin/bash

            # Set deploy directory in home to avoid permission issues
            DEPLOY_DIR=~/mongodb-deploy

            # Create folder if it doesn't exist
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR || exit 1

            # If repo exists, reset and clean; otherwise clone
            if [ -d ".git" ]; then
              echo "Repository exists. Resetting and cleaning..."
              git fetch origin
              git reset --hard origin/Integration/1.10.2025.09.40
              # Skip git clean to preserve untracked files if needed
              # git clean -fd
            else
              echo "Cloning repository..."
              git clone https://github.com/i-hamdan/***-pay.git .
              git checkout Integration/1.10.2025.09.40
            fi

            # Debug: Show branch, commit, and files
            echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"
            echo "Current commit: $(git rev-parse HEAD)"
            echo "Files in $DEPLOY_DIR:"
            ls -la

            # Make sure docker-compose.yml exists, create if missing
            if [ ! -f "docker-compose.yml" ]; then
              echo "Creating default docker-compose.yml..."
              cat <<EOF > docker-compose.yml
            version: '3.8'
            services:
              mongodb:
                image: mongo:latest
                container_name: mongodb
                ports:
                  - "27017:27017"
                volumes:
                  - mongodb_data:/data/db
            volumes:
              mongodb_data:
            EOF
            fi

            # Check if docker-compose is installed
            if ! command -v docker-compose &> /dev/null; then
              echo "Installing docker-compose..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            # Pull latest Docker images and start MongoDB container
            docker-compose pull
            docker-compose up -d

            echo "MongoDB deployment completed successfully!"