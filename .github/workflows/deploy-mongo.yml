name: Deploy MongoDB

on:
  pull_request:
    branches:
      - master

jobs:
  deploy-mongodb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy MongoDB via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /opt/mongodb-deploy
            cd /opt/mongodb-deploy

            # Clone repo if not exists, otherwise pull latest
            if [ ! -d ".git" ]; then
              git clone https://github.com/i-hamdan/sunduk-pay.git .
            else
              git pull
            fi

            # Pull MongoDB image and start container
            docker-compose up -d
