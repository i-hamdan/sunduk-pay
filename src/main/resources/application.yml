media:
  root: ${MEDIA_ROOT:/media}
  base-url: ${MEDIA_BASE_URL:https://wallet.sundukpay.com/media/}

spring:
  mail:
    host: smtp.hostinger.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  redis:
    host: redis
    port: 6379
    timeout: 60000
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
      shutdown-timeout: 100ms

  config:
    import: classpath:queries.yml

  # datasource:
  #   url: jdbc:mysql://walletapp-mysql:3306/sundukpay
  #   username: walletuser
  #   password: walletpass123
  #   driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

  jackson:
    time-zone: Asia/Kolkata

  kafka:
    bootstrap-servers: kafka:9092
    properties:
      security.protocol: PLAINTEXT
      session.timeout.ms: 45000
      request.timeout.ms: 60000
      retry.backoff.ms: 5000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: email-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 19887003498-6uum0ho83vf44vkm7m68tqts5judp0n4.apps.googleusercontent.com
            client-secret: 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
            scope:
              - openid
              - profile
              - email
            redirect-uri: "https://wallet.sundukpay.com/api/sunduk-service/login/oauth2/code/google"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

server:
  port: 8080
  servlet:
    context-path: /api/sunduk-service
    session:
      timeout: 60m
      cookie:
        same-site: none
        secure: true
  tomcat:
    background-processor-delay: 60

sunduk:
