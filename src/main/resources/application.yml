twilio:  account-sid: ${TWILIO_ACCOUNT_SID}  auth-token: ${TWILIO_AUTH_TOKEN}  from-number: ${TWILIO_FROM_NUMBER}spring:  mail:    host: smtp.gmail.com    port: 587    username: ${EMAIL_USERNAME}    password: ${EMAIL_PASSWORD}    properties:      mail:        smtp:          auth: true          starttls:            enable: true            logging:              level:                com:                  bxb:                    sunduk_pay: DEBUG  kafka:    bootstrap-servers: localhost:9092    producer:      key-serializer: org.apache.kafka.common.serialization.StringSerializer      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer    consumer:      group-id: email-group      auto-offset-reset: earliest      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer      properties:        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer        spring.json.trusted.packages: '*'  security:    oauth2:      client:        registration:          google:            client-id: ${GOOGLE_CLIENT_ID}            client-secret: ${GOOGLE_CLIENT_SECRET}            scope:              - openid              - profile              - email            redirect-uri: "{baseUrl}/login/oauth2/code/google"        provider:          google:            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth            token-uri: https://oauth2.googleapis.com/token            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo            user-name-attribute: sub  data:    mongodb:      host: localhost      port: 27017      database: MyDBserver:  port: 8080  servlet:    context-path: /api/sunduk-service    session:      timeout: 60m      cookie:        same-site: none        secure: true  tomcat:    background-processor-delay: 60sunduk:  security:    exclude-paths:      - /api/sunduk-service/oauth2/authorization      - /api/sunduk-service/login/oauth2/code      - /api/sunduk-service/custom-logout      - /api/sunduk-service/custom-login      - /api/sunduk-service/webhook      - /api/sunduk-service/userexchange:  api:    url: https://v6.exchangerate-api.com/v6/09a314fc07e168435db69de3stripe:  key:    secret: sk_test_51RohZUFjIPvwIVrLyRAcI7OWRbYVmEZ976vhMmJDyYyXeCDkpxE0ZPA5XUr7xxqw168zJTtU9S8S5YFFNHoKyYPR00MaFmFn8l  webhook:    secret: whsec_ada8e07c83edd36fb4e5110e64dd53607228345dd6520476ab01dd208701e6b5resilience4j:  circuitbreaker:    instances:      stripeGateway:        registerHealthIndicator: true        slidingWindowType: COUNT_BASED        slidingWindowSize: 10        minimumNumberOfCalls: 5        failureRateThreshold: 50        waitDurationInOpenState: 5s        permittedNumberOfCallsInHalfOpenState: 3        automaticTransitionFromOpenToHalfOpenEnabled: truemanagement:  endpoints:    web:      exposure:        include: "*"  endpoint:    health:      show-details: always