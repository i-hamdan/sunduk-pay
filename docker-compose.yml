version: '3.9'
services:
  app:
    image: ${DOCKER_USERNAME_LOWER}/walletapp:preview
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/walletapp-preview
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI=http://srv1005736.hstgr.cloud/api/sunduk-service/login/oauth2/code/google
    networks:
      - app-network

  mongodb:
    image: mongo:6.0
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=walletapp-preview
    networks:
      - app-network
    # removed ports for safety, still reachable from app

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
