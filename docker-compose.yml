version: '3.9'
services:
  app:
    image: ${DOCKER_USERNAME_LOWER}/walletapp:pr-${PR_NUMBER}
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/sunduk-pay
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI=http://srv1005736.hstgr.cloud/api/sunduk-service/login/oauth2/code/google
    networks:
      - app-network
    ports:
      - "8080:8080"

  mongodb:
    image: mongo:6.0
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    ports:
      - 27017:27017  # for local testing

  nginx:
    image: nginx:1.24
    container_name: walletapp-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/walletapp.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      - app
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
