version: '3.9'
services:
  app:
    image: ${DOCKER_USERNAME_LOWER}/walletapp:preview
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/walletapp-preview
      - GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
      - GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI=http://srv1005736.hstgr.cloud/api/sunduk-service/login/oauth2/code/google
    networks:
      - app-network

  mongodb:
    image: mongo:6.0
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=walletapp-preview
    networks:
      - app-network
    ports:
      - "27017:27017"   # expose MongoDB to host so you can connect from outside

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"  # fixed external port for Nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
